name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache: true

    - name: Check formatting
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then echo "Go code is not formatted!"; exit 1; fi

    - name: Verify dependencies
      run: go mod verify

    - name: Build Core Confd
      run: make build

    - name: Build Postgres Plugin
      run: go build -o bin/confd-plugin-postgres ./cmd/confd-plugin-postgres

    - name: Run Unit Tests
      run: make test

    - name: Run Integration Tests
      run: make test-integration
