name: CI — Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Compile both binaries ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # Full history required for git describe in Makefile

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Mark workspace safe (container git issue)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify dependencies
        run: go mod verify

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build core confd binary
        run: make build

      - name: Build standalone Postgres plugin
        run: go build -buildvcs=false -o bin/confd-plugin-postgres ./cmd/confd-plugin-postgres

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: bin/
          retention-days: 7

  # ── Job 2: Unit Tests ────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Run unit tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v vendor/)

      - name: Display coverage summary
        run: go tool cover -func=coverage.out

  # ── Job 3: PostgreSQL Integration Tests ──────────────────────────────
  postgres-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: confd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build both binaries
        run: |
          make build
          go build -buildvcs=false -o bin/confd-plugin-postgres ./cmd/confd-plugin-postgres

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            pg_isready -h 127.0.0.1 -p 5432 -U admin && break
            echo "Waiting for postgres... ($i/10)"
            sleep 3
          done

      - name: Seed the database (table + triggers)
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U admin -d confd -c "
            CREATE TABLE IF NOT EXISTS confd_config (key VARCHAR(255) PRIMARY KEY, value TEXT);
            INSERT INTO confd_config (key, value) VALUES
              ('/app/database/host', 'db.internal'),
              ('/app/database/port', '5432')
            ON CONFLICT DO NOTHING;
          "

      - name: Run PostgreSQL backend integration test
        env:
          PGPASSWORD: secret
          CONFD_BACKEND_NODE: "127.0.0.1:5432"
          CONFD_USERNAME: admin
          CONFD_PASSWORD: secret
          CONFD_DATABASE: confd
          CONFD_TABLE: confd_config
        run: |
          mkdir -p /tmp/ci-demo/conf.d /tmp/ci-demo/templates /tmp/ci-demo/output
          cat << 'EOF' > /tmp/ci-demo/conf.d/app.toml
          [template]
          src = "app.conf.tmpl"
          dest = "/tmp/ci-demo/output/app.conf"
          keys = [ "/app" ]
          EOF
          echo '{{getv "/app/database/host"}}:{{getv "/app/database/port"}}' > /tmp/ci-demo/templates/app.conf.tmpl
          ./bin/confd plugin --plugin-path "./bin/confd-plugin-postgres" --confdir /tmp/ci-demo --onetime
          grep -q "db.internal:5432" /tmp/ci-demo/output/app.conf
          echo "✅ Plugin integration test passed!"
